services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the database}
    ports:
      - "5432:5432"
    volumes:
      - photobooth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  photobooth-postgres:
